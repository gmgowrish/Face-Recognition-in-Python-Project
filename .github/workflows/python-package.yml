# This workflow installs dependencies, lints, and runs tests for the
# face_attendance app under pythonProject2/.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: pythonProject2

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python in pythonProject2/pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install OpenCV's runtime libraries
      run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest
    - name: Lint with ruff
      run: ruff check face_attendance main.py tests
    - name: Test with pytest
      run: pytest
